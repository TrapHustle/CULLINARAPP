<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Test RawBT · INOVYX TECH</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f6fb; color: #14202e;
         font: 17px/1.5 system-ui, "Segoe UI", Roboto, sans-serif; text-align: center; }
  .numero { font-size: 96px; font-weight: 800; color: #0b1f3a; line-height: 1; }
  button { margin-top: 24px; padding: 22px 56px; border: 0; border-radius: 12px; background: #1768e5; color: #fff;
           font: 800 24px/1 system-ui, sans-serif; text-transform: uppercase; letter-spacing: .06em; cursor: pointer; }
  button:active { transform: translateY(1px); background: #0f56c4; }
  p { color: #5b6670; font-size: 14px; }
  a { color: #1768e5; }
</style>
</head>
<body>
<main>
  <p>Prochain numéro</p>
  <div class="numero" id="numero">1</div>
  <button id="btn-imprimer">Imprimer</button>
  <p><a href="#" id="remise">Recommencer à 1</a> · INOVYX TECH</p>
</main>

<script>
const RAWBT = '#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;';

function imprimerOctets(octets) {
  let s = '';
  for (const o of octets) s += String.fromCharCode(o);
  location.href = 'intent:base64,' + btoa(s) + RAWBT;
}

const DEBUT = [0x1B, 0x40];
// Pas de commande de coupe : RawBT coupe déjà le papier à la fin (réglage « Papier découpé »).
const LARGEUR = 576;                                            // 80 mm ; 384 en 58 mm

// Le texte envoyé en commandes utilise la petite police de l'imprimante :
// on dessine donc le ticket dans un canvas de 576 points, puis on l'envoie en image.
function canvasEnOctets(cv) {
  const largeur = cv.width, h = cv.height;
  const px = cv.getContext('2d').getImageData(0, 0, largeur, h).data, lb = largeur / 8;
  const out = [0x1D, 0x76, 0x30, 0, lb & 255, lb >> 8, h & 255, h >> 8];
  for (let y = 0; y < h; y++) for (let x = 0; x < lb; x++) {
    let o = 0;
    for (let b = 0; b < 8; b++) {
      const i = (y * largeur + x * 8 + b) * 4;
      if (px[i] + px[i + 1] + px[i + 2] < 384) o |= 0x80 >> b;  // pixel foncé = point noir
    }
    out.push(o);
  }
  return out;
}

function dessinerTicket(numero) {
  const cv = document.createElement('canvas');
  cv.width = LARGEUR; cv.height = 400;
  const g = cv.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);
  g.fillStyle = '#000'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = 'bold 44px Arial, sans-serif';
  g.fillText('TICKET', LARGEUR / 2, 40);
  g.font = 'bold 240px Arial, sans-serif';
  g.fillText(String(numero), LARGEUR / 2, 195, LARGEUR - 20);   // le numéro occupe toute la largeur si besoin
  g.font = '34px Arial, sans-serif';
  g.fillText(dateHeure(), LARGEUR / 2, 360);
  return cv;
}

const deux = n => String(n).padStart(2, '0');
const dateHeure = (d = new Date()) =>
  deux(d.getDate()) + '/' + deux(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + deux(d.getHours()) + ':' + deux(d.getMinutes());

let numero = 1;
try { numero = Number(localStorage.getItem('rawbt-numero')) || 1; } catch (e) {}
const affichage = document.getElementById('numero');
affichage.textContent = numero;

document.getElementById('btn-imprimer').onclick = () => {
  imprimerOctets([...DEBUT, ...canvasEnOctets(dessinerTicket(numero))]);
  numero += 1;
  affichage.textContent = numero;
  try { localStorage.setItem('rawbt-numero', numero); } catch (e) {}
};

document.getElementById('remise').onclick = (e) => {
  e.preventDefault();
  numero = 1;
  affichage.textContent = numero;
  try { localStorage.setItem('rawbt-numero', 1); } catch (e) {}
};
</script>
</body>
</html>
